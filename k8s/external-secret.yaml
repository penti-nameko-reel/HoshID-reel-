apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hoshid-secrets-sync
  namespace: hoshid
  annotations:
    # Argo CD の Migration ジョブ（wave 1）より前の wave 0 で生成させる
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend # 環境に合わせて ClusterSecretStore / SecretStore 名を指定
    kind: ClusterSecretStore # または SecretStore
  target:
    name: hoshid-secrets
    creationPolicy: Owner
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: secret/data/hoshid
        property: BETTER_AUTH_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/hoshid
        property: DATABASE_URL
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: secret/data/hoshid
        property: DISCORD_BOT_TOKEN
    - secretKey: DISCORD_CLIENT_ID
      remoteRef:
        key: secret/data/hoshid
        property: DISCORD_CLIENT_ID
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef:
        key: secret/data/hoshid
        property: DISCORD_CLIENT_SECRET
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: secret/data/hoshid
        property: GITHUB_CLIENT_ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: secret/data/hoshid
        property: GITHUB_CLIENT_SECRET
    - secretKey: GITHUB_CONTRIBUTIONS_TOKEN
      remoteRef:
        key: secret/data/hoshid
        property: GITHUB_CONTRIBUTIONS_TOKEN
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/hoshid
        property: POSTGRES_PASSWORD
    - secretKey: SEED_ADMIN_EMAIL
      remoteRef:
        key: secret/data/hoshid
        property: SEED_ADMIN_EMAIL
    - secretKey: SEED_ADMIN_PASSWORD
      remoteRef:
        key: secret/data/hoshid
        property: SEED_ADMIN_PASSWORD
    - secretKey: SMTP_PASS
      remoteRef:
        key: secret/data/hoshid
        property: SMTP_PASS
    - secretKey: SMTP_USER
      remoteRef:
        key: secret/data/hoshid
        property: SMTP_USER