apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoshid
  namespace: hoshid
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hoshid
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hoshid
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/ibuki-hum4/hoshid:v0.1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          # IPv6 (::) で Listen させるための環境変数を追加
          env:
            - name: HOSTNAME
              value: "::"

          envFrom:
            - configMapRef:
                name: hoshid-config
            - secretRef:
                name: hoshid-secrets

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 3
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}